<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Mẫu Kiểm Tra QC Mobile</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 10px; background: #fdfdfd; color: #333; }
        h2 { text-align: center; color: #0056b3; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .photo-section { border: 1px dashed #007bff; padding: 15px; margin-top: 20px; border-radius: 6px; background: #f0f8ff; }
        .photo-slot { margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ddd; }
        .preview-img { max-width: 100%; height: 120px; object-fit: cover; margin-top: 8px; display: none; border-radius: 4px; border: 1px solid #ccc; }
        button.submit-btn { width: 100%; padding: 15px; background: #007bff; color: white; border: none; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; }
        button.submit-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h2>BIỂU MẪU KIỂM TRA QC</h2>
    <form id="qcForm">
        <div class="form-group">
            <label>Xưởng (Factory):</label>
            <input type="text" name="factory" required>
        </div>
        <div class="form-group">
            <label>Mã PO:</label>
            <input type="text" name="po" required>
        </div>
        <div class="form-group">
            <label>Mã Nhân Viên Kiểm Tra (Inspector ID):</label>
            <input type="text" name="inspector_id" required>
        </div>
        <div class="form-group">
            <label>Kết luận ngoại quan (Evaluation):</label>
            <select name="evaluation">
                <option value="合格">合格 (Đạt)</option>
                <option value="不合格">不合格 (Không đạt)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Ghi chú (Note):</label>
            <textarea name="note" rows="3"></textarea>
        </div>

        <div class="photo-section">
            <h3>18 Ảnh Chụp Minh Họa Giám Sát</h3>
            <div id="slots-container"></div>
        </div>

        <button type="submit" class="submit-btn">Gửi Báo Cáo</button>
    </form>

    <script>
        const container = document.getElementById('slots-container');
        for (let i = 1; i <= 18; i++) {
            const slotDiv = document.createElement('div');
            slotDiv.className = 'photo-slot';
            slotDiv.innerHTML = `
                <label>Ảnh vị trí ${i}:</label>
                <input type="file" name="photo_${i}" accept="image/*" onchange="previewImage(event, ${i})">
                <img id="preview_${i}" class="preview-img">
            `;
            container.appendChild(slotDiv);
        }

        function previewImage(event, index) {
            const file = event.target.files[0];
            const preview = document.getElementById(`preview_${index}`);
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        }

        document.getElementById('qcForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    alert('Gửi báo cáo thành công!');
                    window.location.reload();
                } else {
                    alert('Lỗi: ' + result.message);
                }
            } catch (err) {
                alert('Đã xảy ra lỗi kết nối tới server.');
            }
        });
    </script>
</body>
</html>
