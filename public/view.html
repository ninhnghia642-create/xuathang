<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Báo Cáo Kiểm Tra Giám Sát Kho Vận Sàn</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #fff; color: #000; }
        .sheet-container { max-width: 950px; margin: 0 auto; border: 1px solid #000; padding: 20px; }
        h2 { text-align: center; margin-bottom: 20px; }
        .meta-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .meta-table td { padding: 8px; border: 1px solid #000; font-size: 14px; }
        
        .photo-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .photo-table th, .photo-table td { border: 1px solid #000; padding: 8px; text-align: center; vertical-align: middle; }
        .photo-table th { background-color: #f2f2f2; font-size: 13px; }
        .photo-cell img { width: 140px; height: 100px; object-fit: cover; border: 1px solid #ccc; display: block; margin: 0 auto; }
        .photo-label { font-size: 12px; font-weight: bold; margin-bottom: 4px; text-align: left; }
        
        .btn-print { display: block; width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 25px; text-align: center; text-decoration: none; }
        .btn-print:hover { background: #218838; }
        @media print {
            .btn-print { display: none; }
            body { margin: 0; }
            .sheet-container { border: none; }
        }
    </style>
</head>
<body>
    <div class="sheet-container">
        <h2>监装检验报告<br><span style="font-size: 16px; font-weight: normal;">Báo cáo kiểm tra giám sát kho vận sàn</span></h2>
        
        <table class="meta-table">
            <tr>
                <td><strong>Xưởng / Factory:</strong> <span id="val-factory">---</span></td>
                <td><strong>Mã PO:</strong> <span id="val-po">---</span></td>
                <td><strong>Mã NV (Inspector):</strong> <span id="val-inspector">---</span></td>
            </tr>
            <tr>
                <td colspan="2"><strong>Ngoại quan / Evaluation:</strong> <span id="val-eval">---</span></td>
                <td><strong>Ngày kiểm tra:</strong> <span id="val-date">---</span></td>
            </tr>
            <tr>
                <td colspan="3"><strong>Ghi chú / Note:</strong> <span id="val-note">---</span></td>
            </tr>
        </table>

        <h3>Danh sách 18 mục ảnh thực tế giám sát</h3>
        <table class="photo-table" id="photo-table-grid">
            <!-- Được render động qua JavaScript mô phỏng 6 hàng x 3 cột -->
        </table>

        <button class="btn-print" onclick="window.print()">🖨️ In Báo Cáo / Lưu thành PDF</button>
    </div>

    <script>
        const titles = [
            "1. 整柜照片 Ảnh toàn bộ container",
            "2. 托盘标照片 Ảnh tem pallet",
            "3. 托盘含水率照片 Ảnh độ ẩm pallet",
            "4. 盖板(含水率) Ảnh độ ẩm ván đậy",
            "5. 塑钢带/缠绕膜 Ảnh dây nhựa/màng chít",
            "6. 装车照片 Ảnh quá trình đóng xe",
            "7. 是否淋雨(外观潮湿) Ảnh kiểm tra ẩm ướt/mưa",
            "8. 熏蒸章照片 Ảnh dấu hun trùng",
            "9. 批次照片-1/số lô pallet",
            "10. 集装箱内部侧面照片 Ảnh bên trong container",
            "11. 空箱照片 Ảnh container rỗng",
            "12. 装满三分之一照片 Ảnh đóng 1/3",
            "13. 装满二分之一照片 Ảnh đóng 1/2",
            "14. 装满关一个门照片 Ảnh đóng 1 cửa",
            "15. 装满关门照片 Ảnh đóng kín cửa",
            "16. 车牌号照片 Ảnh biển số xe",
            "17. 装单照片 Ảnh danh mục xuất hàng",
            "18. 封号照片 Ảnh số chì niêm phong"
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const reportId = urlParams.get('id');

        if (reportId) {
            fetch(`/api/reports/${reportId}`)
                .then(res => res.json())
                .then(report => {
                    if (report.data) {
                        document.getElementById('val-factory').innerText = report.data.factory || '';
                        document.getElementById('val-po').innerText = report.data.po || '';
                        document.getElementById('val-inspector').innerText = report.data.inspector_id || '';
                        document.getElementById('val-eval').innerText = report.data.evaluation || '';
                        document.getElementById('val-note').innerText = report.data.note || '';
                        document.getElementById('val-date').innerText = new Date(report.createdAt).toLocaleDateString();
                    }

                    const tableGrid = document.getElementById('photo-table-grid');
                    tableGrid.innerHTML = '';

                    // Chia 18 ảnh thành 6 hàng, mỗi hàng 3 cột
                    for (let row = 0; row < 6; row++) {
                        const tr = document.createElement('tr');
                        
                        for (let col = 0; col < 3; col++) {
                            const index = row * 3 + col; // Từ 0 đến 17
                            const file = report.files && report.files[index];
                            
                            const td = document.createElement('td');
                            td.className = 'photo-cell';
                            
                            let htmlContent = `<div class="photo-label">${titles[index] || `Ảnh ${index + 1}`}</div>`;
                            if (file) {
                                htmlContent += `<img src="/uploads/${file.filename}" alt="Ảnh ${index + 1}">`;
                            } else {
                                htmlContent += `<div style="height: 100px; line-height: 100px; color: #888; font-style: italic;">Chưa có ảnh</div>`;
                            }
                            td.innerHTML = htmlContent;
                            tr.appendChild(td);
                        }
                        tableGrid.appendChild(tr);
                    }
                })
                .catch(err => {
                    alert('Không thể tải dữ liệu báo cáo!');
                });
        }
    </script>
</body>
</html>
