<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Báo Cáo Kho Ván Sàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Login Modal -->
    <div id="loginSection" class="container mt-5" style="max-width: 400px; display: none;">
        <div class="card shadow p-4">
            <h3 class="text-center mb-3">Đăng Nhập Quản Trị</h3>
            <div class="mb-3">
                <label>Tài khoản</label>
                <input type="text" id="username" class="form-control" value="admin">
            </div>
            <div class="mb-3">
                <label>Mật khẩu</label>
                <input type="password" id="password" class="form-control" value="Ab@123456">
            </div>
            <button onclick="handleLogin()" class="btn btn-primary w-100">Đăng Nhập</button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="mainSection" class="container mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Quản Lý Báo Cáo Kiểm Tra Giám Sát Kho</h2>
            <div>
                <a href="/mobile.html" class="btn btn-warning me-2">Mở Form Nhập Liệu Mobile</a>
                <button onclick="handleLogout()" class="btn btn-danger">Đăng Xuất</button>
            </div>
        </div>
        <div class="card shadow p-3">
            <h4>Danh Sách Báo Cáo Đã Gửi</h4>
            <table class="table table-bordered table-striped mt-3">
                <thead>
                    <tr>
                        <th>Thời Gian</th>
                        <th>Xưởng / PO</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <!-- Dữ liệu -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem("qc_user");
            if (savedUser) {
                showDashboard();
            } else {
                document.getElementById("loginSection").style.display = "block";
            }
        });

        async function handleLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem("qc_user", JSON.stringify(data.user));
                showDashboard();
            } else {
                alert(data.message);
            }
        }

        function handleLogout() {
            localStorage.removeItem("qc_user");
            location.reload();
        }

        function showDashboard() {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("mainSection").style.display = "block";
            loadReports();
        }

        async function loadReports() {
            const res = await fetch('/api/reports');
            const reports = await res.json();
            const tbody = document.getElementById("reportTableBody");
            tbody.innerHTML = "";
            if(reports.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Chưa có báo cáo nào</td></tr>`;
                return;
            }
            reports.forEach(r => {
                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(r.createdAt).toLocaleString()}</td>
                        <td>Xưởng: ${r.data.factory || 'N/A'} - PO: ${r.data.po || 'N/A'}</td>
                        <td>
                            <a href="/api/export/${r.id}" class="btn btn-success btn-sm me-2">Xuất Excel</a>
                            <button onclick="deleteReport(${r.id})" class="btn btn-danger btn-sm">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteReport(id) {
            if(confirm("Bạn có chắc chắn muốn xóa báo cáo này không?")) {
                await fetch(`/api/reports/${id}`, { method: 'DELETE' });
                loadReports();
            }
        }
    </script>
</body>
</html>
